# https://pre-commit.com/
ci:
  autoupdate_schedule: monthly
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: mkdocs.yml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.2
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project env)
        # Runs against the real dependency set (icechunk, zarr, boto3-stubs,
        # ...) so production code and the operational scripts are actually
        # type-checked; the isolated mirrors-mypy hook saw only stubs and
        # reduced several checks to no-ops.
        entry: >-
          uv run mypy lambda cdk
          scripts/verify_store.py
        language: system
        pass_filenames: false
        types_or: [python, toml]
  - repo: https://github.com/citation-file-format/cff-converter-python
    rev: ebf0b5e44d67f8beaa1cd13a0d0393ea04c6058d
    hooks:
      - id: validate-cff
