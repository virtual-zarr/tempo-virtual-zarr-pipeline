<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-label="The SQS consumer routes each granule against the time axis and manifest: append after the axis end, overwrite when time and owner match, reject to the DLQ on an owner mismatch, defer to the pending ledger when the time is out of order." font-family="'Comic Shanns Mono', 'Comic Mono', 'Comic Neue', 'Comic Sans MS', cursive">
  <defs>
    <marker id="d-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker>
    <marker id="d-ice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
    <marker id="d-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
    <marker id="d-alm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="540" fill="#FCFBF8"/>
  <text x="24" y="36" font-size="15" font-weight="700" fill="#1e1e1e">How the consumer routes incoming granules</text>

  <!-- incoming messages -->
  <text x="60" y="72" font-size="10.5" fill="#868e96">granules off the queue</text>
  <rect x="60" y="84" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="74" y="106" font-size="11" font-weight="700" fill="#1e1e1e">t = 21:42 (S013)</text>
  <text x="74" y="124" font-size="9.5" fill="#868e96">after the axis end</text>
  <rect x="60" y="172" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="74" y="194" font-size="11" font-weight="700" fill="#1e1e1e">t = 19:42 &#183; UR = S011</text>
  <text x="74" y="212" font-size="9.5" fill="#868e96">slot exists, same owner</text>
  <rect x="60" y="260" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="74" y="282" font-size="11" font-weight="700" fill="#1e1e1e">t = 19:42 &#183; UR = S011b</text>
  <text x="74" y="300" font-size="9.5" fill="#868e96">slot owned by another UR</text>
  <rect x="60" y="348" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="74" y="370" font-size="11" font-weight="700" fill="#1e1e1e">t = 18:42 (S010)</text>
  <text x="74" y="388" font-size="9.5" fill="#868e96">&#8804; axis end, no slot</text>

  <!-- time axis -->
  <text x="340" y="214" font-size="10.5" fill="#868e96">time axis + manifest (slot &#8594; owner UR)</text>
  <rect x="340" y="226" width="90" height="48" rx="5" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
  <text x="385" y="246" font-size="10.5" fill="#1e1e1e" text-anchor="middle">17:42</text>
  <text x="385" y="262" font-size="8.5" fill="#868e96" text-anchor="middle">S009</text>
  <rect x="436" y="226" width="90" height="48" rx="5" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
  <text x="481" y="246" font-size="10.5" fill="#1e1e1e" text-anchor="middle">19:42</text>
  <text x="481" y="262" font-size="8.5" fill="#868e96" text-anchor="middle">S011</text>
  <rect x="532" y="226" width="90" height="48" rx="5" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
  <text x="577" y="246" font-size="10.5" fill="#1e1e1e" text-anchor="middle">20:42</text>
  <text x="577" y="262" font-size="8.5" fill="#868e96" text-anchor="middle">S012</text>
  <line x1="630" y1="218" x2="630" y2="282" stroke="#868e96" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="638" y="286" font-size="9" fill="#868e96">axis end</text>
  <rect x="642" y="226" width="90" height="48" rx="5" fill="none" stroke="#1971c2" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="687" y="254" font-size="12" fill="#1971c2" text-anchor="middle">+</text>

  <!-- 1: append -->
  <path d="M 262,112 L 687,112 L 687,222" fill="none" stroke="#1971c2" stroke-width="1.5" marker-end="url(#d-ice)"/>
  <text x="450" y="100" font-size="10.5" font-weight="700" fill="#1971c2">append</text>

  <!-- 2: overwrite -->
  <path d="M 262,200 L 481,200 L 481,222" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#d-ink)"/>
  <text x="330" y="188" font-size="10.5" font-weight="700" fill="#1e1e1e">overwrite in place</text>

  <!-- 3: reject to DLQ -->
  <rect x="340" y="440" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#e03131" stroke-width="1.4"/>
  <text x="430" y="464" font-size="11.5" font-weight="700" fill="#e03131" text-anchor="middle">DLQ</text>
  <text x="430" y="482" font-size="9.5" fill="#868e96" text-anchor="middle">operator decides</text>
  <path d="M 262,288 L 306,288 L 306,468 L 336,468" fill="none" stroke="#e03131" stroke-width="1.5" marker-end="url(#d-alm)"/>
  <text x="316" y="360" font-size="10.5" font-weight="700" fill="#e03131">reject</text>

  <!-- 4: defer to pending ledger -->
  <rect x="620" y="440" width="230" height="56" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.4"/>
  <text x="735" y="464" font-size="11.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">pending ledger</text>
  <text x="735" y="482" font-size="9.5" fill="#868e96" text-anchor="middle">in-store &#183; commits with the batch</text>
  <path d="M 262,376 L 700,376 L 700,436" fill="none" stroke="#e8590c" stroke-width="1.6" marker-end="url(#d-sig)"/>
  <text x="480" y="364" font-size="10.5" font-weight="700" fill="#e8590c">defer</text>
  <path d="M 840,438 C 860,300 600,300 441,280" fill="none" stroke="#868e96" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#d-ink)"/>
  <text x="640" y="352" font-size="9.5" fill="#868e96" text-anchor="middle">folded into the gap by re-sort (fig 5)</text>
</svg>
