<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-label="Serving the virtual store: titiler-multidim exposes tiles and point queries near term and polygon statistics long term, opening the repo at a snapshot and fetching referenced bytes from the source bucket; long term deck.gl-raster in the browser reads the repo directly and renders on the GPU without a tile server." font-family="'Comic Shanns Mono', 'Comic Mono', 'Comic Neue', 'Comic Sans MS', cursive">
  <defs>
    <marker id="f-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker>
    <marker id="f-vio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741d9"/></marker>
    <pattern id="f-hg" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#40c057" opacity="0.28"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#2f9e44" stroke-width="0.9" opacity="0.55"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#2f9e44" stroke-width="0.9" opacity="0.55"/>
    </pattern>
    <pattern id="f-ho" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#fd7e14" opacity="0.28"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#e8590c" stroke-width="0.9" opacity="0.55"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e8590c" stroke-width="0.9" opacity="0.55"/>
    </pattern>
    <pattern id="f-hv" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#7950f2" opacity="0.22"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#6741d9" stroke-width="0.9" opacity="0.5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#6741d9" stroke-width="0.9" opacity="0.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1080" height="600" fill="#FCFBF8"/>
  <text x="24" y="36" font-size="16" font-weight="700" fill="#1e1e1e">Serving the store: titiler-multidim, then deck.gl-raster</text>

  <!-- portal -->
  <rect x="40" y="90" width="180" height="80" rx="10" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="56" y="120" font-size="12" font-weight="700" fill="#1e1e1e">AIR4US portal</text>
  <text x="56" y="138" font-size="10" fill="#868e96">map + charts</text>
  <line x1="222" y1="130" x2="276" y2="130" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f-ink)"/>

  <!-- titiler container -->
  <rect x="280" y="80" width="400" height="300" rx="12" fill="none" stroke="#1e1e1e" stroke-width="1.6"/>
  <rect x="296" y="92" width="26" height="26" rx="5" fill="url(#f-ho)" stroke="#e8590c" stroke-width="1.2"/>
  <text x="309" y="112" font-size="15" fill="#1e1e1e" text-anchor="middle">&#955;</text>
  <text x="332" y="110" font-size="12.5" font-weight="700" fill="#1e1e1e">titiler-multidim</text>

  <rect x="300" y="130" width="360" height="56" rx="8" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="314" y="150" font-size="11" font-weight="700" fill="#1e1e1e">/tiles/{z}/{x}/{y}</text>
  <text x="314" y="168" font-size="9" fill="#868e96">sel=time=&#8230; &amp; sel_method=nearest &#183; 1 scan/render</text>
  <rect x="576" y="138" width="70" height="16" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1"/>
  <text x="611" y="149" font-size="8.5" fill="#1971c2" text-anchor="middle">near term</text>

  <rect x="300" y="198" width="360" height="52" rx="8" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="314" y="218" font-size="11" font-weight="700" fill="#1e1e1e">/point/{lon},{lat}</text>
  <text x="314" y="236" font-size="9" fill="#868e96">pixel time series across scans</text>
  <rect x="576" y="206" width="70" height="16" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1"/>
  <text x="611" y="217" font-size="8.5" fill="#1971c2" text-anchor="middle">near term</text>

  <rect x="300" y="262" width="360" height="56" rx="8" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="314" y="282" font-size="11" font-weight="700" fill="#1e1e1e">/statistics (GeoJSON polygon)</text>
  <text x="314" y="300" font-size="9" fill="#868e96">zonal statistics over the time axis</text>
  <rect x="576" y="270" width="70" height="16" rx="8" fill="#e5dbff" stroke="#6741d9" stroke-width="1"/>
  <text x="611" y="281" font-size="8.5" fill="#6741d9" text-anchor="middle">long term</text>

  <text x="480" y="352" font-size="9.5" font-style="italic" fill="#868e96" text-anchor="middle">per-request latency is dominated by virtual-chunk</text>
  <text x="480" y="366" font-size="9.5" font-style="italic" fill="#868e96" text-anchor="middle">fetches &#8212; a dataset/session cache is advisable</text>

  <!-- store column -->
  <rect x="860" y="90" width="180" height="120" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
  <rect x="872" y="102" width="30" height="30" rx="6" fill="url(#f-hg)" stroke="#2f9e44" stroke-width="1.2"/>
  <path d="M 880,111 A 7,2.6 0 0 0 894,111 L 891.5,123 A 4.5,1.8 0 0 1 882.5,123 Z" fill="none" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="912" y="116" font-size="12" font-weight="700" fill="#1e1e1e">Icechunk</text>
  <text x="912" y="131" font-size="9.5" fill="#868e96">refs + manifest</text>
  <text x="872" y="158" font-size="9.5" fill="#1e1e1e">readers open one</text>
  <text x="872" y="172" font-size="9.5" fill="#1e1e1e">consistent snapshot</text>
  <text x="872" y="186" font-size="9.5" fill="#868e96">(~KB of metadata)</text>

  <rect x="860" y="420" width="180" height="110" rx="10" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.5"/>
  <rect x="872" y="432" width="30" height="30" rx="6" fill="url(#f-hg)" stroke="#2f9e44" stroke-width="1.2"/>
  <path d="M 880,441 A 7,2.6 0 0 0 894,441 L 891.5,453 A 4.5,1.8 0 0 1 882.5,453 Z" fill="none" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="912" y="446" font-size="11" font-weight="700" fill="#1e1e1e">source</text>
  <text x="912" y="460" font-size="11" font-weight="700" fill="#1e1e1e">bucket</text>
  <text x="872" y="486" font-size="9" fill="#868e96">asdc-prod-protected</text>
  <text x="872" y="500" font-size="9" fill="#868e96">TEMPO granules (.nc)</text>
  <text x="872" y="518" font-size="9" fill="#868e96">EDL-authorized reads</text>

  <!-- titiler -> store / source -->
  <line x1="682" y1="130" x2="856" y2="130" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f-ink)"/>
  <text x="768" y="118" font-size="9.5" fill="#1e1e1e" text-anchor="middle">open @ snapshot</text>
  <path d="M 682,330 L 775,330 L 775,450 L 856,450" fill="none" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f-ink)"/>
  <text x="686" y="305" font-size="9.5" fill="#1e1e1e">chunk fetches</text>
  <text x="686" y="318" font-size="9.5" fill="#868e96">(EDL bearer)</text>

  <!-- deck.gl lane -->
  <rect x="280" y="440" width="400" height="120" rx="12" fill="none" stroke="#6741d9" stroke-width="1.6" stroke-dasharray="8 5"/>
  <rect x="296" y="452" width="26" height="26" rx="5" fill="url(#f-hv)" stroke="#6741d9" stroke-width="1.2"/>
  <rect x="302" y="459" width="14" height="9" rx="1.5" fill="none" stroke="#1e1e1e" stroke-width="1.3"/>
  <line x1="309" y1="468" x2="309" y2="472" stroke="#1e1e1e" stroke-width="1.3"/>
  <line x1="304" y1="472" x2="314" y2="472" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="332" y="470" font-size="12.5" font-weight="700" fill="#1e1e1e">deck.gl-raster in the browser</text>
  <rect x="588" y="456" width="70" height="16" rx="8" fill="#e5dbff" stroke="#6741d9" stroke-width="1"/>
  <text x="623" y="467" font-size="8.5" fill="#6741d9" text-anchor="middle">long term</text>
  <text x="296" y="498" font-size="9.5" fill="#1e1e1e">icechunk/zarr client reads the repo directly;</text>
  <text x="296" y="512" font-size="9.5" fill="#1e1e1e">WebGL renders rasters on the GPU &#8212; no tile server</text>
  <text x="296" y="536" font-size="9" fill="#868e96">open question: delivering EDL temporary credentials</text>
  <text x="296" y="549" font-size="9" fill="#868e96">to the browser for the source-bucket reads</text>

  <!-- portal -> deck lane -->
  <path d="M 130,172 L 130,500 L 276,500" fill="none" stroke="#6741d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f-vio)"/>
  <text x="140" y="330" font-size="9.5" fill="#6741d9">same portal,</text>
  <text x="140" y="344" font-size="9.5" fill="#6741d9">no server hop</text>

  <!-- deck -> store / source -->
  <path d="M 682,480 L 805,480 L 805,152 L 856,152" fill="none" stroke="#6741d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f-vio)"/>
  <text x="813" y="300" font-size="9.5" fill="#6741d9">reads refs</text>
  <text x="813" y="314" font-size="9.5" fill="#6741d9">(HTTP range)</text>
  <path d="M 682,510 L 856,510" fill="none" stroke="#6741d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f-vio)"/>
  <text x="768" y="498" font-size="9.5" fill="#6741d9" text-anchor="middle">byte-range GETs</text>
</svg>
