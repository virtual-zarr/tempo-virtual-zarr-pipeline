<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Re-sort folds the pending ledger into place on a branch built from a pinned snapshot: existing slots shift via reindex_array without re-reading sources, only the inserted granule is parsed, the ledger drains in the same commit, and main moves by compare-and-swap." font-family="'Comic Shanns Mono', 'Comic Mono', 'Comic Neue', 'Comic Sans MS', cursive">
  <defs>
    <marker id="e-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker>
    <marker id="e-ice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
    <marker id="e-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#FCFBF8"/>
  <text x="24" y="36" font-size="15" font-weight="700" fill="#1e1e1e">Re-sort: folding the pending ledger into place</text>

  <!-- row 1: main at pinned snapshot -->
  <text x="40" y="106" font-size="10.5" fill="#868e96">main @ pinned</text>
  <text x="40" y="120" font-size="10.5" fill="#868e96">snapshot</text>
  <rect x="180" y="90" width="84" height="42" rx="5" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
  <text x="222" y="116" font-size="10.5" fill="#1e1e1e" text-anchor="middle">17:42</text>
  <rect x="272" y="90" width="84" height="42" rx="5" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
  <text x="314" y="116" font-size="10.5" fill="#1e1e1e" text-anchor="middle">19:42</text>
  <rect x="364" y="90" width="84" height="42" rx="5" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
  <text x="406" y="116" font-size="10.5" fill="#1e1e1e" text-anchor="middle">20:42</text>
  <rect x="456" y="90" width="84" height="42" rx="5" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
  <text x="498" y="116" font-size="10.5" fill="#1e1e1e" text-anchor="middle">21:42</text>

  <rect x="660" y="82" width="220" height="58" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.4"/>
  <text x="676" y="104" font-size="11" font-weight="700" fill="#1e1e1e">pending ledger</text>
  <text x="676" y="124" font-size="10" fill="#1e1e1e">{ 18:42 &#8594; S010 }</text>

  <!-- row 2: resort branch -->
  <text x="40" y="286" font-size="10.5" fill="#868e96">resort branch</text>
  <rect x="180" y="268" width="84" height="42" rx="5" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
  <text x="222" y="294" font-size="10.5" fill="#1e1e1e" text-anchor="middle">17:42</text>
  <rect x="272" y="268" width="84" height="42" rx="5" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
  <text x="314" y="294" font-size="10.5" font-weight="700" fill="#e8590c" text-anchor="middle">18:42</text>
  <rect x="364" y="268" width="84" height="42" rx="5" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
  <text x="406" y="294" font-size="10.5" fill="#1e1e1e" text-anchor="middle">19:42</text>
  <rect x="456" y="268" width="84" height="42" rx="5" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
  <text x="498" y="294" font-size="10.5" fill="#1e1e1e" text-anchor="middle">20:42</text>
  <rect x="548" y="268" width="84" height="42" rx="5" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
  <text x="590" y="294" font-size="10.5" fill="#1e1e1e" text-anchor="middle">21:42</text>

  <!-- reindex shifts -->
  <path d="M 314,134 C 330,200 380,230 402,264" fill="none" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#e-ice)"/>
  <path d="M 406,134 C 422,200 472,230 494,264" fill="none" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#e-ice)"/>
  <path d="M 498,134 C 514,200 564,230 586,264" fill="none" stroke="#1971c2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#e-ice)"/>
  <text x="560" y="196" font-size="10.5" font-weight="700" fill="#1971c2">reindex_array: refs move,</text>
  <text x="560" y="212" font-size="10.5" font-weight="700" fill="#1971c2">no source file re-read</text>

  <!-- ledger entry parsed into new slot -->
  <path d="M 668,144 C 560,220 420,230 328,264" fill="none" stroke="#e8590c" stroke-width="1.6" marker-end="url(#e-sig)"/>
  <text x="680" y="170" font-size="10" font-weight="700" fill="#e8590c" text-anchor="start">only this granule parsed</text>

  <!-- ledger drains -->
  <rect x="660" y="268" width="220" height="58" rx="8" fill="#FFFFFF" stroke="#adb5bd" stroke-width="1.3"/>
  <text x="676" y="290" font-size="11" font-weight="700" fill="#868e96">pending ledger { }</text>
  <text x="676" y="310" font-size="9.5" fill="#868e96">drained in the same commit</text>
  <line x1="840" y1="142" x2="840" y2="264" stroke="#e8590c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#e-sig)"/>

  <!-- promote row -->
  <path d="M 406,312 L 406,388" fill="none" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#e-ink)"/>
  <text x="416" y="354" font-size="10" fill="#1e1e1e">one fold commit (&#8804; 500 granules, earliest first)</text>

  <rect x="180" y="392" width="330" height="76" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="196" y="418" font-size="12" font-weight="700" fill="#e8590c">CAS: main &#8594; resort tip</text>
  <text x="196" y="438" font-size="9.5" fill="#1e1e1e">succeeds only if main still equals the</text>
  <text x="196" y="452" font-size="9.5" fill="#1e1e1e">snapshot the run pinned at the start</text>

  <rect x="560" y="392" width="380" height="76" rx="8" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="576" y="418" font-size="11" font-weight="700" fill="#1e1e1e">consumer appended mid-run?</text>
  <text x="576" y="438" font-size="9.5" fill="#868e96">CAS fails loudly &#183; the append is not erased &#183;</text>
  <text x="576" y="452" font-size="9.5" fill="#868e96">nothing was consumed &#183; next run retries</text>
  <line x1="512" y1="430" x2="556" y2="430" stroke="#1e1e1e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#e-ink)"/>

  <text x="500" y="520" font-size="10" font-style="italic" fill="#868e96" text-anchor="middle">slots after the insertion point are relocated as metadata, so old insertions cost the same as recent ones</text>
</svg>
