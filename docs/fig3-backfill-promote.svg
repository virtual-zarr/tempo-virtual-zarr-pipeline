<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 570" role="img" aria-label="Backfill: a validated inventory defines the axis; Step Functions fans out partitions whose workers write disjoint regions into Icechunk forks, merged to one commit per partition on the backfill branch; a promote gate validates the pinned tip and moves main with a compare-and-swap." font-family="'Comic Shanns Mono', 'Comic Mono', 'Comic Neue', 'Comic Sans MS', cursive">
  <defs>
    <marker id="c-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker>
    <marker id="c-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="570" fill="#FCFBF8"/>
  <text x="24" y="36" font-size="15" font-weight="700" fill="#1e1e1e">Backfill: fork/merge partitions and the promote gate</text>

  <!-- inventory -->
  <rect x="40" y="80" width="190" height="112" rx="8" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="56" y="104" font-size="12" font-weight="700" fill="#1e1e1e">inventory.json</text>
  <text x="56" y="126" font-size="9.5" fill="#868e96">one entry per granule:</text>
  <text x="56" y="140" font-size="9.5" fill="#868e96">url &#183; UR &#183; exact /time[0]</text>
  <text x="56" y="158" font-size="9.5" fill="#868e96">sorted, no duplicates</text>
  <text x="56" y="172" font-size="9.5" fill="#868e96">(validated twice)</text>

  <!-- init -->
  <rect x="40" y="270" width="190" height="90" rx="8" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="56" y="294" font-size="12" font-weight="700" fill="#1e1e1e">init</text>
  <text x="56" y="314" font-size="9.5" fill="#868e96">full-shape store on the</text>
  <text x="56" y="328" font-size="9.5" fill="#868e96">backfill branch &#8212; metadata</text>
  <text x="56" y="342" font-size="9.5" fill="#868e96">+ coordinates only</text>
  <line x1="135" y1="194" x2="135" y2="266" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#c-ink)"/>
  <text x="143" y="234" font-size="10" fill="#1e1e1e">defines axis</text>

  <!-- step functions map -->
  <rect x="290" y="70" width="420" height="360" rx="12" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="306" y="94" font-size="12" font-weight="700" fill="#1e1e1e">Step Functions distributed map</text>
  <line x1="232" y1="140" x2="286" y2="140" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#c-ink)"/>
  <text x="259" y="128" font-size="10" fill="#1e1e1e" text-anchor="middle">partition</text>

  <!-- partition 1 lane -->
  <rect x="310" y="110" width="380" height="140" rx="8" fill="#FCFBF8" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="322" y="130" font-size="10.5" fill="#868e96">partition 1 &#183; &#8804; 500 granules</text>
  <rect x="322" y="144" width="118" height="56" rx="6" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.2"/>
  <text x="381" y="166" font-size="10.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">workers &#955; &#215;50</text>
  <text x="381" y="182" font-size="9" fill="#868e96" text-anchor="middle">parse + validate</text>
  <rect x="458" y="144" width="118" height="56" rx="6" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
  <text x="517" y="166" font-size="10.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">forks</text>
  <text x="517" y="182" font-size="9" fill="#868e96" text-anchor="middle">disjoint slot ranges</text>
  <rect x="594" y="144" width="84" height="56" rx="6" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.2"/>
  <text x="636" y="166" font-size="10.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">merge</text>
  <text x="636" y="182" font-size="9" fill="#868e96" text-anchor="middle">1 commit</text>
  <line x1="440" y1="172" x2="454" y2="172" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#c-ink)"/>
  <line x1="576" y1="172" x2="590" y2="172" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#c-ink)"/>

  <!-- partition 2 lane -->
  <rect x="310" y="266" width="380" height="140" rx="8" fill="#FCFBF8" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="322" y="286" font-size="10.5" fill="#868e96">partition 2</text>
  <rect x="322" y="300" width="118" height="56" rx="6" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.2"/>
  <text x="381" y="322" font-size="10.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">workers &#955; &#215;50</text>
  <text x="381" y="338" font-size="9" fill="#868e96" text-anchor="middle">parse + validate</text>
  <rect x="458" y="300" width="118" height="56" rx="6" fill="#d0ebff" stroke="#1971c2" stroke-width="1.2"/>
  <text x="517" y="322" font-size="10.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">forks</text>
  <text x="517" y="338" font-size="9" fill="#868e96" text-anchor="middle">disjoint slot ranges</text>
  <rect x="594" y="300" width="84" height="56" rx="6" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.2"/>
  <text x="636" y="322" font-size="10.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">merge</text>
  <text x="636" y="338" font-size="9" fill="#868e96" text-anchor="middle">1 commit</text>
  <line x1="440" y1="328" x2="454" y2="328" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#c-ink)"/>
  <line x1="576" y1="328" x2="590" y2="328" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#c-ink)"/>

  <text x="500" y="422" font-size="10" font-style="italic" fill="#1e1e1e" text-anchor="middle">a worker failure fails the run before anything reaches main</text>

  <!-- promote gate -->
  <rect x="760" y="90" width="244" height="300" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="776" y="118" font-size="12.5" font-weight="700" fill="#1e1e1e">promote gate</text>
  <text x="776" y="134" font-size="9.5" fill="#868e96">re-validates the pinned tip</text>
  <text x="776" y="164" font-size="10" fill="#1e1e1e">&#10003; store == template</text>
  <text x="776" y="186" font-size="10" fill="#1e1e1e">&#10003; axis == inventory times</text>
  <text x="776" y="208" font-size="10" fill="#1e1e1e">&#10003; manifest == inventory URs</text>
  <text x="776" y="230" font-size="10" fill="#1e1e1e">&#10003; coords == reference arrays</text>
  <text x="776" y="252" font-size="10" fill="#1e1e1e">&#10003; chunk-ref count == grid</text>
  <text x="776" y="274" font-size="9.5" fill="#868e96">(an unwritten slot would pass</text>
  <text x="776" y="288" font-size="9.5" fill="#868e96">every metadata-only check)</text>
  <line x1="776" y1="306" x2="988" y2="306" stroke="#e8590c" stroke-width="1"/>
  <text x="776" y="330" font-size="10.5" font-weight="700" fill="#e8590c">then CAS: main &#8594; tip</text>
  <text x="776" y="350" font-size="9.5" fill="#868e96">same snapshot it validated;</text>
  <text x="776" y="364" font-size="9.5" fill="#868e96">nothing is written after it</text>

  <!-- branch timelines -->
  <text x="40" y="466" font-size="10.5" fill="#868e96">backfill branch</text>
  <line x1="180" y1="478" x2="1000" y2="478" stroke="#1e1e1e" stroke-width="1.4"/>
  <circle cx="250" cy="478" r="5" fill="#1e1e1e"/>
  <text x="250" y="464" font-size="9.5" fill="#1e1e1e" text-anchor="middle">init</text>
  <circle cx="520" cy="478" r="5" fill="#1e1e1e"/>
  <text x="520" y="464" font-size="9.5" fill="#1e1e1e" text-anchor="middle">P1 commit</text>
  <circle cx="660" cy="478" r="5" fill="#1e1e1e"/>
  <text x="660" y="464" font-size="9.5" fill="#1e1e1e" text-anchor="middle">P2 commit = tip</text>

  <text x="40" y="520" font-size="10.5" fill="#868e96">main</text>
  <line x1="180" y1="532" x2="1000" y2="532" stroke="#1e1e1e" stroke-width="1.4"/>
  <circle cx="250" cy="532" r="5" fill="#1e1e1e"/>
  <text x="250" y="552" font-size="9.5" fill="#868e96" text-anchor="middle">old tip: readers stay here until the CAS</text>
  <circle cx="660" cy="532" r="5" fill="#e8590c"/>
  <line x1="660" y1="484" x2="660" y2="525" stroke="#e8590c" stroke-width="1.8" marker-end="url(#c-sig)"/>
  <text x="672" y="508" font-size="10" font-weight="700" fill="#e8590c">CAS</text>
  <path d="M 880,392 C 880,450 770,466 682,476 " fill="none" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#c-sig)"/>
  <text x="888" y="436" font-size="9.5" fill="#e8590c">validate @ pinned tip</text>
</svg>
