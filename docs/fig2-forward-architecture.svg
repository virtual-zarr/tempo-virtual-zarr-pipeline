<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" role="img" aria-label="Forward-processing architecture: a CMR poller feeds an SQS queue consumed by a single-concurrency Lambda that commits to the Icechunk repo; a re-sort job folds the pending ledger; backfill, garbage collection, and an independent verification script complete the stack." font-family="'Comic Shanns Mono', 'Comic Mono', 'Comic Neue', 'Comic Sans MS', cursive">
  <defs>
    <marker id="b-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker>
    <marker id="b-sig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
    <marker id="b-alm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
    <marker id="b-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker>
    <pattern id="b-hg" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#40c057" opacity="0.28"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#2f9e44" stroke-width="0.9" opacity="0.55"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#2f9e44" stroke-width="0.9" opacity="0.55"/>
    </pattern>
    <pattern id="b-ho" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#fd7e14" opacity="0.28"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#e8590c" stroke-width="0.9" opacity="0.55"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e8590c" stroke-width="0.9" opacity="0.55"/>
    </pattern>
    <pattern id="b-hp" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#e64980" opacity="0.25"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#c2255c" stroke-width="0.9" opacity="0.5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c2255c" stroke-width="0.9" opacity="0.5"/>
    </pattern>
    <pattern id="b-hv" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#7950f2" opacity="0.22"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#6741d9" stroke-width="0.9" opacity="0.5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#6741d9" stroke-width="0.9" opacity="0.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1080" height="660" fill="#FCFBF8"/>
  <text x="24" y="36" font-size="16" font-weight="700" fill="#1e1e1e">One CDK stack per collection (hcho / no2)</text>

  <!-- externals -->
  <rect x="40" y="102" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="115" y="126" font-size="12.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">NASA CMR</text>
  <text x="115" y="144" font-size="10" fill="#868e96" text-anchor="middle">granule catalog</text>

  <rect x="40" y="330" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.5"/>
  <rect x="52" y="342" width="30" height="30" rx="6" fill="url(#b-hg)" stroke="#2f9e44" stroke-width="1.2"/>
  <path d="M 60,351 A 7,2.6 0 0 0 74,351 L 71.5,363 A 4.5,1.8 0 0 1 62.5,363 Z" fill="none" stroke="#1e1e1e" stroke-width="1.3"/>
  <text x="92" y="356" font-size="11" font-weight="700" fill="#1e1e1e">source</text>
  <text x="92" y="370" font-size="11" font-weight="700" fill="#1e1e1e">bucket</text>
  <text x="52" y="390" font-size="8.5" fill="#868e96">asdc-prod-protected (.nc)</text>

  <!-- stack container -->
  <rect x="250" y="60" width="550" height="480" rx="14" fill="none" stroke="#1e1e1e" stroke-width="1.6"/>
  <text x="266" y="86" font-size="13" font-weight="700" fill="#1e1e1e">CDK stack</text>

  <!-- poller -->
  <rect x="290" y="100" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.5"/>
  <rect x="302" y="114" width="32" height="32" rx="6" fill="url(#b-ho)" stroke="#e8590c" stroke-width="1.2"/>
  <text x="318" y="141" font-size="18" fill="#1e1e1e" text-anchor="middle">&#955;</text>
  <text x="344" y="126" font-size="11.5" font-weight="700" fill="#1e1e1e">CMR poller</text>
  <text x="344" y="144" font-size="10" fill="#868e96">every 30 min</text>
  <!-- sqs -->
  <rect x="560" y="100" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.5"/>
  <rect x="572" y="114" width="32" height="32" rx="6" fill="url(#b-hp)" stroke="#c2255c" stroke-width="1.2"/>
  <rect x="578" y="121" width="20" height="4" rx="2" fill="#1e1e1e"/>
  <rect x="578" y="128" width="20" height="4" rx="2" fill="#1e1e1e"/>
  <rect x="578" y="135" width="20" height="4" rx="2" fill="#1e1e1e"/>
  <text x="614" y="126" font-size="11.5" font-weight="700" fill="#1e1e1e">file queue (SQS)</text>
  <text x="614" y="144" font-size="10" fill="#868e96">+ redrive policy</text>

  <line x1="288" y1="130" x2="194" y2="130" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b-ink)"/>
  <text x="241" y="118" font-size="10" fill="#1e1e1e" text-anchor="middle">polls</text>
  <line x1="482" y1="130" x2="556" y2="130" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b-ink)"/>
  <text x="519" y="118" font-size="10" fill="#1e1e1e" text-anchor="middle">enqueue</text>

  <!-- dlq / consumer -->
  <rect x="290" y="224" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#e03131" stroke-width="1.5"/>
  <rect x="302" y="236" width="30" height="30" rx="6" fill="url(#b-hp)" stroke="#c2255c" stroke-width="1.2"/>
  <rect x="308" y="243" width="18" height="4" rx="2" fill="#1e1e1e"/>
  <rect x="308" y="250" width="18" height="4" rx="2" fill="#1e1e1e"/>
  <rect x="308" y="257" width="18" height="4" rx="2" fill="#1e1e1e"/>
  <text x="342" y="248" font-size="11.5" font-weight="700" fill="#e03131">DLQ</text>
  <text x="342" y="266" font-size="10" fill="#868e96">depth alarm</text>
  <rect x="560" y="220" width="190" height="64" rx="10" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.5"/>
  <rect x="572" y="236" width="32" height="32" rx="6" fill="url(#b-ho)" stroke="#e8590c" stroke-width="1.2"/>
  <text x="588" y="263" font-size="18" fill="#1e1e1e" text-anchor="middle">&#955;</text>
  <text x="614" y="246" font-size="11.5" font-weight="700" fill="#1e1e1e">SQS consumer</text>
  <text x="614" y="264" font-size="10" fill="#868e96">concurrency 1</text>

  <path d="M 655,162 L 655,216" fill="none" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b-ink)"/>
  <text x="663" y="192" font-size="10" fill="#1e1e1e">&#8804; 10 / batch</text>
  <line x1="556" y1="252" x2="444" y2="252" stroke="#e03131" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b-alm)"/>
  <text x="500" y="272" font-size="9.5" fill="#e03131" text-anchor="middle">same time, &#8800; UR</text>

  <!-- backfill / resort -->
  <rect x="290" y="330" width="210" height="80" rx="10" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.5"/>
  <rect x="302" y="354" width="32" height="32" rx="6" fill="url(#b-hv)" stroke="#6741d9" stroke-width="1.2"/>
  <circle cx="318" cy="363" r="3.2" fill="none" stroke="#1e1e1e" stroke-width="1.3"/>
  <circle cx="310" cy="377" r="3.2" fill="none" stroke="#1e1e1e" stroke-width="1.3"/>
  <circle cx="326" cy="377" r="3.2" fill="none" stroke="#1e1e1e" stroke-width="1.3"/>
  <line x1="315" y1="366" x2="311" y2="374" stroke="#1e1e1e" stroke-width="1.2"/>
  <line x1="321" y1="366" x2="325" y2="374" stroke="#1e1e1e" stroke-width="1.2"/>
  <text x="344" y="356" font-size="11.5" font-weight="700" fill="#1e1e1e">backfill</text>
  <text x="344" y="374" font-size="10" fill="#868e96">Step Functions, one-time</text>
  <text x="344" y="390" font-size="10" fill="#868e96">fork / merge bulk load</text>
  <rect x="560" y="340" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.5"/>
  <rect x="572" y="354" width="32" height="32" rx="6" fill="url(#b-ho)" stroke="#e8590c" stroke-width="1.2"/>
  <text x="588" y="381" font-size="18" fill="#1e1e1e" text-anchor="middle">&#955;</text>
  <text x="614" y="366" font-size="11.5" font-weight="700" fill="#1e1e1e">re-sort job</text>
  <text x="614" y="384" font-size="10" fill="#868e96">every 24 h</text>

  <!-- gc -->
  <rect x="560" y="440" width="190" height="56" rx="10" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.5"/>
  <rect x="572" y="452" width="32" height="32" rx="6" fill="url(#b-ho)" stroke="#e8590c" stroke-width="1.2"/>
  <circle cx="588" cy="461" r="3.2" fill="none" stroke="#1e1e1e" stroke-width="1.3"/>
  <circle cx="580" cy="475" r="3.2" fill="none" stroke="#1e1e1e" stroke-width="1.3"/>
  <circle cx="596" cy="475" r="3.2" fill="none" stroke="#1e1e1e" stroke-width="1.3"/>
  <line x1="585" y1="464" x2="581" y2="472" stroke="#1e1e1e" stroke-width="1.2"/>
  <line x1="591" y1="464" x2="595" y2="472" stroke="#1e1e1e" stroke-width="1.2"/>
  <text x="614" y="464" font-size="11.5" font-weight="700" fill="#1e1e1e">garbage collect</text>
  <text x="614" y="482" font-size="10" fill="#868e96">scheduled, optional</text>

  <!-- store -->
  <rect x="860" y="90" width="190" height="440" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
  <rect x="872" y="102" width="32" height="32" rx="6" fill="url(#b-hg)" stroke="#2f9e44" stroke-width="1.2"/>
  <path d="M 880,111 A 8,3 0 0 0 896,111 L 893,125 A 5,2 0 0 1 883,125 Z" fill="none" stroke="#1e1e1e" stroke-width="1.4"/>
  <text x="912" y="116" font-size="12.5" font-weight="700" fill="#1e1e1e">Icechunk</text>
  <text x="912" y="131" font-size="9.5" fill="#868e96">S3, one per collection</text>
  <rect x="875" y="152" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#1971c2" stroke-width="1.2"/>
  <text x="885" y="172" font-size="10.5" font-weight="700" fill="#1e1e1e">main branch</text>
  <text x="885" y="188" font-size="9.5" fill="#868e96">time axis + variables</text>
  <text x="885" y="202" font-size="9.5" fill="#868e96">virtual chunk refs</text>
  <rect x="875" y="236" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#1971c2" stroke-width="1.2"/>
  <text x="885" y="256" font-size="10.5" font-weight="700" fill="#1e1e1e">manifest</text>
  <text x="885" y="272" font-size="9.5" fill="#868e96">slot &#8594; granule UR</text>
  <rect x="875" y="306" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#e8590c" stroke-width="1.3"/>
  <text x="885" y="326" font-size="10.5" font-weight="700" fill="#1e1e1e">pending ledger</text>
  <text x="885" y="342" font-size="9.5" fill="#868e96">out-of-order arrivals</text>
  <text x="875" y="392" font-size="9.5" fill="#1e1e1e">all three commit atomically,</text>
  <text x="875" y="406" font-size="9.5" fill="#1e1e1e">in-store; nothing can drift</text>
  <text x="875" y="434" font-size="9.5" fill="#868e96">snapshots kept 30 d</text>
  <text x="875" y="448" font-size="9.5" fill="#868e96">(rollback window)</text>

  <!-- arrows into store -->
  <line x1="752" y1="252" x2="856" y2="252" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b-ink)"/>
  <rect x="746" y="230" width="118" height="14" fill="#FCFBF8"/>
  <text x="804" y="240" font-size="10" fill="#1e1e1e" text-anchor="middle">append / overwrite</text>
  <line x1="752" y1="370" x2="856" y2="370" stroke="#e8590c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#b-sig)"/>
  <rect x="768" y="348" width="72" height="14" fill="#FCFBF8"/>
  <text x="804" y="358" font-size="10" font-weight="700" fill="#e8590c" text-anchor="middle">fold + CAS</text>
  <line x1="752" y1="468" x2="856" y2="468" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b-ink)"/>
  <rect x="760" y="446" width="88" height="14" fill="#FCFBF8"/>
  <text x="804" y="456" font-size="10" fill="#1e1e1e" text-anchor="middle">expire &#62; 30 d</text>
  <path d="M 502,395 L 528,395 L 528,512 L 856,512" fill="none" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b-ink)"/>
  <text x="700" y="506" font-size="10" fill="#1e1e1e" text-anchor="middle">backfill branch &#8594; CAS main</text>

  <!-- stack reads source granules -->
  <line x1="248" y1="365" x2="194" y2="365" stroke="#868e96" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#b-mut)"/>
  <text x="221" y="353" font-size="9.5" fill="#868e96" text-anchor="middle">reads</text>

  <!-- verify -->
  <rect x="860" y="560" width="190" height="70" rx="10" fill="#FFFFFF" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="955" y="586" font-size="12" font-weight="700" fill="#1e1e1e" text-anchor="middle">verify_store.py</text>
  <text x="955" y="604" font-size="10" fill="#868e96" text-anchor="middle">operator-run QA</text>
  <line x1="955" y1="558" x2="955" y2="534" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b-ink)"/>
  <text x="946" y="550" font-size="9.5" fill="#1e1e1e" text-anchor="end">samples bytes</text>
  <path d="M 858,600 L 20,600 L 20,130 L 36,130" fill="none" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b-ink)"/>
  <text x="440" y="590" font-size="9.5" fill="#868e96" text-anchor="middle">asks CMR which granule should own each sampled time</text>
</svg>
