[project]
name = "cmr-poller-lambda"
version = "0.1.0"
description = "Scheduled CMR revision-date poller feeding the forward-processing queue"
requires-python = ">=3.12"

dependencies = [
    "aws-lambda-powertools>=2.30.0",
    "boto3>=1.34.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
