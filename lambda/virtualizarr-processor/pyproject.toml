[project]
name = "virtualizarr-processor"
version = "0.1.0"
description = "Module for ingesting virtualizarr data to Icechunk"
requires-python = ">=3.12"
dependencies = [
    "icechunk>=2.1",
    "obspec-utils",
    "obstore",
    "opentelemetry-api>=1.20",
    "pydantic>=2",
    "pydantic-zarr>=0.10",
    "virtualizarr[hdf]>=2.7",
    # only pins versions, it can't add packages the tree doesn't require).
    "requests>=2.31",
    "virtualizarr[hdf]>=2.7",
    "zarr>=3.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["virtualizarr_processor"]
