# Buildspec for the stack's InventoryBuild CodeBuild project: runs
# scripts/build_backfill_inventory.py recording direct s3:// links (what the
# deployed workers read and write into the store's virtual refs). Headers
# are read over direct in-region S3 using EDL temporary credentials (the
# same s3credentials exchange the deployed workers use), so reads and the
# recorded links are the same s3:// urls. Started, with its source zip, by
# scripts/run_codebuild.sh; COLLECTION / S3_URI / MAX_COUNT and the
# EARTHDATA_TOKEN secret are wired up by the CDK project definition.
version: 0.2

phases:
  install:
    commands:
      - curl -LsSf https://astral.sh/uv/install.sh | sh
  build:
    commands:
      - export PATH="$HOME/.local/bin:$PATH"
      - uv run scripts/build_backfill_inventory.py
        --collection "$COLLECTION"
        --access direct
        --workers 8
        ${MAX_COUNT:+--max-count "$MAX_COUNT"}
        --s3-uri "$S3_URI"
